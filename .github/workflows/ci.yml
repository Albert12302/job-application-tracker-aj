name: CI

# What the repo already decided has to be checked automatically:
#   - CLAUDE.md "Testing": the unit suite runs in TWO timezones, because the
#     §5.4 date bug is invisible at or east of Greenwich and a UTC-only runner
#     proves nothing;
#   - SPEC §7.6: an automated vulnerability scan, in CI and on a schedule;
#   - SPEC §10.5: automated accessibility checks — axe runs inside the
#     component tests, so `npm test` carries them.
#
# The Playwright suite is not here yet: it needs the whole Supabase stack (and
# the edge functions, with their env) on the runner. The flaky §7.1 sign-in
# timing check that also kept it out has been made reliable — it compares the
# fastest samples, which parallel load cannot slow. Adding the job is now only
# the work of standing the stack up in CI.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # The audit is worth running even when nobody has pushed: advisories are
    # published against code that has not changed. Mondays, 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs, not version tags. A tag is a mutable
# pointer: whoever can move `v4` can run their code in this workflow. The
# trailing comment is the release the SHA was, so a human can read it; Dependabot
# updates both together, so pinning does not mean going stale.
#   Resolve a new one with:  git ls-remote --tags https://github.com/actions/<name>
jobs:
  check:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `tsc -b --noEmit`, not `tsc --noEmit`: the root tsconfig is
      # solution-style, so the plain form compiles zero files and always passes
      # (CLAUDE.md).
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (UTC)
        env:
          TZ: UTC
        run: npm test

      # The second zone is the whole point: `date_applied` is stored at UTC
      # midnight and must format in UTC everywhere (§5.4). Rendered in local
      # time, it shows the previous day west of Greenwich — and nowhere east of
      # it. The guard is not ceremony: if the zone silently fails to apply, the
      # suite goes green having tested nothing new, which is exactly the failure
      # this job exists to prevent.
      - name: Unit tests (America/Los_Angeles)
        env:
          TZ: America/Los_Angeles
        run: |
          node -e "
            const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (zone !== 'America/Los_Angeles') {
              console.error('TZ did not apply — resolved to ' + zone + '. The second timezone run would prove nothing.');
              process.exit(1);
            }
            console.log('timezone confirmed: ' + zone);
          "
          npm test

      # Also proves vite.config.ts can still read the CSP out of vercel.json,
      # which is what keeps the two from drifting (§7.5).
      - name: Build
        run: npm run build

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Blocking, and only on what ships: a high or critical advisory in a
      # runtime dependency is in the bundle the browser runs (§7.6).
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev dependencies are worth seeing but not worth blocking a merge on —
      # they never reach a user, and an unfixable advisory in a test tool would
      # otherwise stop all work.
      - name: Audit everything (report only)
        if: always()
        run: npm audit || true
